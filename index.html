<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTF & 暗号解読演習システム</title>
  <style>
 
  <!-- ナビゲーションバー -->
  <nav>
    <button onclick="showScreen('play-screen')">演習画面</button>
    <button onclick="showScreen('list-screen')">問題一覧</button>
    <button onclick="showScreen('tool-screen')">解析ツール</button>
    <button onclick="showScreen('guide-screen')">解説・豆知識</button>
    <button onclick="showScreen('save-screen')">セーブ・記録</button>
  </nav>

  <!-- ステータスバー -->
  <div class="status-bar">
    <div class="status-item">レート: <span id="user-rate" class="status-value">1000</span></div>
    <div class="status-item">正解数: <span id="user-solved" class="status-value">0</span></div>
    <div class="status-item">挑戦回数: <span id="user-attempts" class="status-value">0</span></div>
    <div class="status-item">正解率: <span id="user-accuracy" class="status-value">0%</span></div>
  </div>

  <main>
    <!-- ==========================================
         1. 演習画面 (play-screen)
         ========================================== -->
    <div id="play-screen" class="page-screen active">
      <div class="card">
        <h2 id="difficulty">難易度: --</h2>
        <p id="question" style="font-size: 16px; line-height: 1.6; margin-bottom: 20px;">問題を読み込み中...</p>
        
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
          <input type="text" id="answer" placeholder="Flagまたは回答を入力してください (例: FLAG{...})">
          <button class="exercise-submit-btn" onclick="checkAnswer()">送信</button>
        </div>
        <p id="result" style="font-weight: bold; min-height: 24px;"></p>
      </div>

      <!-- 簡易解析ツール（ドロップダウン） -->
      <div class="card" style="padding: 10px 20px;">
        <div onclick="toggleDropdown()" style="cursor: pointer; display: flex; justify-content: space-between; align-items: center;">
          <span style="font-weight: bold; color: #94a3b8;">簡易解析ツール</span>
          <span id="arrow-icon" style="transition: transform 0.3s;">▽</span>
        </div>

        <div id="tools-dropdown" class="dropdown-container">
          <div style="padding: 15px 0;">
            <div style="margin-bottom: 15px;">
              <label style="font-size: 14px; color: #94a3b8; margin-right: 10px;">デコード方式:</label>
              <select id="inline-tool-selector" onchange="switchInlineTool()" style="width: auto; display: inline-block;">
                <option value="base64">Base64 デコーダー</option>
                <option value="hex">Hex (16進数) デコーダー</option>
                <option value="caesar">Caesar デコーダー</option>
                <option value="atbash">Atbash デコーダー</option>
              </select>
            </div>

            <!-- Base64エリア -->
            <div id="inline-base64-area">
              <div style="display: flex; gap: 10px;">
                <input type="text" id="tool-base64-input" class="tool-input" placeholder="Base64文字列を入力">
                <button class="exercise-submit-btn" onclick="runBase64()">デコード</button>
              </div>
              <p id="tool-base64-result" style="margin-top: 10px; font-weight: bold;"></p>
              <img id="tool-base64-img" style="margin-top: 10px; max-width: 100%; display: none;">
            </div>

            <!-- Hexエリア -->
            <div id="inline-hex-area" style="display: none;">
              <div style="display: flex; gap: 10px;">
                <input type="text" id="tool-hex-input" class="tool-input" placeholder="例: 48 65 6c 6c 6f">
                <button class="exercise-submit-btn" onclick="runHex()">デコード</button>
              </div>
              <p id="tool-hex-result" style="margin-top: 10px; font-weight: bold;"></p>
            </div>

            <!-- Caesarエリア -->
            <div id="inline-caesar-area" style="display: none;">
              <div style="display: flex; gap: 10px;">
                <input type="text" id="inline-caesar-input" class="tool-input" placeholder="暗号文を入力 (例: Khoor)">
                <select id="inline-caesar-shift" style="width: auto;">
                  <!-- JSで1〜25の選択肢が挿入されます -->
                </select>
                <button class="exercise-submit-btn" onclick="runInlineCaesar()">デコード</button>
              </div>
              <p id="inline-caesar-result" style="margin-top: 10px; font-weight: bold;"></p>
            </div>

            <!-- Atbashエリア -->
            <div id="inline-atbash-area" style="display: none;">
              <div style="display: flex; gap: 10px;">
                <input type="text" id="inline-atbash-input" class="tool-input" placeholder="暗号文を入力 (例: Svool)">
                <button class="exercise-submit-btn" onclick="runInlineAtbash()">デコード</button>
              </div>
              <p id="inline-atbash-result" style="margin-top: 10px; font-weight: bold;"></p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ==========================================
         2. 問題一覧画面 (list-screen)
         ========================================== -->
    <div id="list-screen" class="page-screen">
      <div class="card">
        <h2>問題一覧</h2>
        <p style="color: #94a3b8; margin-bottom: 15px;">挑戦したい問題を選択してください。</p>
        <div id="question-list" class="grid-container">
          <!-- JSで自動的に問題ボタンが生成されます -->
        </div>
      </div>
    </div>

    <!-- ==========================================
         3. 解析ツール独立画面 (tool-screen)
         ========================================== -->
    <div id="tool-screen" class="page-screen">
      <div class="card">
        <h2>解析ツール (独立機能)</h2>
        
        <!-- Base64 -->
        <div style="margin-bottom: 25px;">
          <h3 style="color: #38bdf8; font-size: 16px; margin-bottom: 8px;">Base64 デコーダー</h3>
          <div style="display: flex; gap: 10px;">
            <input type="text" id="tool-base64-input" class="tool-input" placeholder="Base64文字列を入力">
            <button class="exercise-submit-btn" onclick="runIndependentBase64()">デコード</button>
          </div>
          <p id="tool-base64-result" style="margin-top: 8px; font-weight: bold; color: #00ffcc;"></p>
          <img id="tool-base64-img" style="margin-top: 10px; max-width: 100%; display: none;">
        </div>

        <!-- Hex -->
        <div style="margin-bottom: 25px;">
          <h3 style="color: #38bdf8; font-size: 16px; margin-bottom: 8px;">Hex (16進数) デコーダー</h3>
          <div style="display: flex; gap: 10px;">
            <input type="text" id="tool-hex-input" class="tool-input" placeholder="例: 48 65 6c 6c 6f">
            <button class="exercise-submit-btn" onclick="runIndependentHex()">デコード</button>
          </div>
          <p id="tool-hex-result" style="margin-top: 8px; font-weight: bold; color: #00ffcc;"></p>
        </div>

        <!-- Caesar -->
        <div style="margin-bottom: 25px;">
          <h3 style="color: #38bdf8; font-size: 16px; margin-bottom: 8px;">Caesar (シーザー暗号) デコーダー</h3>
          <div style="display: flex; gap: 10px;">
            <input type="text" id="tool-caesar-input" class="tool-input" placeholder="暗号文を入力">
            <select id="tool-caesar-shift" style="width: auto;">
              <!-- JSで生成 -->
            </select>
            <button class="exercise-submit-btn" onclick="runCaesar()">デコード</button>
          </div>
          <p id="tool-caesar-result" style="margin-top: 8px; font-weight: bold; color: #00ffcc;"></p>
        </div>

        <!-- Atbash -->
        <div>
          <h3 style="color: #38bdf8; font-size: 16px; margin-bottom: 8px;">Atbash (アトバシュ暗号) デコーダー</h3>
          <div style="display: flex; gap: 10px;">
            <input type="text" id="tool-atbash-input" class="tool-input" placeholder="暗号文を入力">
            <button class="exercise-submit-btn" onclick="runAtbash()">デコード</button>
          </div>
          <p id="tool-atbash-result" style="margin-top: 8px; font-weight: bold; color: #00ffcc;"></p>
        </div>
      </div>
    </div>

    <!-- ==========================================
         4. 解説・豆知識画面 (guide-screen)
         ========================================== -->
    <div id="guide-screen" class="page-screen">
      <div class="card">
        <h2>暗号とエンコードの豆知識</h2>
        
        <div style="margin-bottom: 20px;">
          <h3 style="color: #0ea5e9; font-size: 16px;">1. Base64 エンコード</h3>
          <p style="margin-top: 5px; color: #cbd5e1;">
            64種類の英数字・記号 (<code>A-Z</code>, <code>a-z</code>, <code>0-9</code>, <code>+</code>, <code>/</code>) を使ってデータを表現する方式です。<br>
            末尾にパディングとして <code>=</code> または <code>==</code> が付く特徴があります。
          </p>
        </div>

        <div style="margin-bottom: 20px;">
          <h3 style="color: #0ea5e9; font-size: 16px;">2. Caesar 暗号 (シーザー暗号)</h3>
          <p style="margin-top: 5px; color: #cbd5e1;">
            アルファベットを指定した文字数だけずらす単一換字式暗号です。<br>
            例えば、13文字ずらす設定は <code>ROT13</code> と呼ばれ、掲示板のネタバレ防止などで広く使われます。
          </p>
        </div>

        <div style="margin-bottom: 20px;">
          <h3 style="color: #0ea5e9; font-size: 16px;">3. Atbash 暗号 (アトバシュ暗号)</h3>
          <p style="margin-top: 5px; color: #cbd5e1;">
            アルファベットのAとZ、BとYのように、アルファベットの順序を完全に逆転させる換字暗号です。
          </p>
        </div>

        <div>
          <h3 style="color: #0ea5e9; font-size: 16px;">4. Hex (16進数表現)</h3>
          <p style="margin-top: 5px; color: #cbd5e1;">
            コンピュータのバイトデータを <code>0-9</code> および <code>a-f</code> (または <code>A-F</code>) の2桁の16進数で表現したものです。<br>
            例: ASCIIの "A" は 16進数で <code>41</code> となります。
          </p>
        </div>
      </div>
    </div>

    <!-- ==========================================
         5. セーブ・記録画面 (save-screen)
         ========================================== -->
    <div id="save-screen" class="page-screen">
      <div class="card">
        <h2>セーブ・記録情報</h2>
        <p style="color: #cbd5e1; margin-bottom: 15px;">現在のプレイ実績と進行状況です。</p>
        
        <div style="line-height: 2;">
          <p>現在のレート: <strong id="save-rate" style="color: #00ffcc;">1000</strong></p>
          <p>クリア問題数: <strong id="save-solved" style="color: #00ffcc;">0</strong></p>
          <p>総解答試行数: <strong id="save-attempts" style="color: #00ffcc;">0</strong></p>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
