<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTF Web App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ナビゲーションバー -->
  <nav class="navbar">
    <button class="nav-btn" onclick="showScreen('play-screen')">問題挑戦</button>
    <button class="nav-btn" onclick="showScreen('list-screen')">問題一覧</button>
    <button class="nav-btn" onclick="showScreen('tools-screen')">解析ツール</button>
  </nav>

  <!-- 上部ステータス表示 -->
  <div class="status-bar">
    <span>レート: <strong id="user-rate">1000</strong></span>
    <span>正解数: <strong id="user-solved">0</strong></span>
    <span>挑戦数: <strong id="user-attempts">0</strong></span>
    <span>正答率: <strong id="user-accuracy">0%</strong></span>
  </div>

  <main>
    <!-- 1. 問題挑戦画面 -->
    <div id="play-screen" class="page-screen active">
      <div id="difficulty" class="difficulty-tag">難易度: --</div>
      <div id="question" class="question-box">問題を読み込み中...</div>

      <div class="answer-section">
        <input type="text" id="answer" placeholder="FLAGを入力 (例: FLAG{...})" />
        <button onclick="checkAnswer()">送信</button>
      </div>

      <div id="result" class="result-message"></div>

      <!-- 解答欄の下の「簡易解析ツール」 -->
      <div class="accordion-container">
        <button class="accordion-header" onclick="toggleDropdown()">
          簡易解析ツール <span id="arrow-icon">▽</span>
        </button>
        <div id="tools-dropdown" class="accordion-content">
          <div class="tool-selector-container">
            <select id="inline-tool-selector" onchange="switchInlineTool()">
              <option value="base64">Base64 デコード</option>
              <option value="hex">16進数 (Hex) デコード</option>
              <option value="binary">2進数 (Binary) デコード</option>
              <option value="caesar">シーザー暗号 (Caesar)</option>
              <option value="atbash">アトバシュ暗号 (Atbash)</option>
              <option value="vigenere">ヴィジュネル暗号 (Vigenère)</option>
              <option value="url">URL デコード</option>
              <option value="html">HTMLエンティティ デコード</option>
              <option value="hash">ハッシュ値識別 (Hash)</option>
            </select>
          </div>

          <!-- 各インラインツールエリア -->
          <div id="inline-base64-area" class="inline-tool-area">
            <textarea id="tool-base64-input" placeholder="Base64文字列を入力"></textarea>
            <button onclick="runBase64()">デコード実行</button>
            <div id="tool-base64-result" class="tool-result"></div>
            <img id="tool-base64-img" class="result-image" style="display:none;" />
          </div>

          <div id="inline-hex-area" class="inline-tool-area" style="display:none;">
            <textarea id="tool-hex-input" placeholder="16進数文字列を入力 (例: 48 65 6c 6c 6f)"></textarea>
            <button onclick="runHex()">デコード実行</button>
            <div id="tool-hex-result" class="tool-result"></div>
          </div>

          <div id="inline-binary-area" class="inline-tool-area" style="display:none;">
            <textarea id="inline-binary-input" placeholder="2進数文字列を入力 (例: 01001000 01100101)"></textarea>
            <button onclick="runInlineBinary()">デコード実行</button>
            <div id="inline-binary-result" class="tool-result"></div>
          </div>

          <div id="inline-caesar-area" class="inline-tool-area" style="display:none;">
            <select id="inline-caesar-shift"></select>
            <textarea id="inline-caesar-input" placeholder="暗号文を入力"></textarea>
            <button onclick="runInlineCaesar()">復号実行</button>
            <div id="inline-caesar-result" class="tool-result"></div>
          </div>

          <div id="inline-atbash-area" class="inline-tool-area" style="display:none;">
            <textarea id="inline-atbash-input" placeholder="暗号文を入力"></textarea>
            <button onclick="runInlineAtbash()">復号実行</button>
            <div id="inline-atbash-result" class="tool-result"></div>
          </div>

          <div id="inline-vigenere-area" class="inline-tool-area" style="display:none;">
            <input type="text" id="inline-vigenere-key" placeholder="鍵 (Key) を入力" />
            <textarea id="inline-vigenere-input" placeholder="暗号文を入力"></textarea>
            <button onclick="runInlineVigenere()">復号実行</button>
            <div id="inline-vigenere-result" class="tool-result"></div>
          </div>

          <div id="inline-url-area" class="inline-tool-area" style="display:none;">
            <textarea id="inline-url-input" placeholder="URLエンコードされた文字列を入力"></textarea>
            <button onclick="runInlineUrl()">デコード実行</button>
            <div id="inline-url-result" class="tool-result"></div>
          </div>

          <div id="inline-html-area" class="inline-tool-area" style="display:none;">
            <textarea id="inline-html-input" placeholder="HTMLエンティティを入力 (例: &amp;#72;)"></textarea>
            <button onclick="runInlineHtml()">デコード実行</button>
            <div id="inline-html-result" class="tool-result"></div>
          </div>

          <div id="inline-hash-area" class="inline-tool-area" style="display:none;">
            <textarea id="inline-hash-input" placeholder="ハッシュ値を入力"></textarea>
            <button onclick="runInlineHash()">識別実行</button>
            <div id="inline-hash-result" class="tool-result"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. 問題一覧画面 -->
    <div id="list-screen" class="page-screen">
      <h2>問題一覧</h2>
      <div id="question-list" class="question-grid"></div>
    </div>

    <!-- 3. 独立解析ツール画面 -->
    <div id="tools-screen" class="page-screen">
      <h2>解析ツール一覧</h2>
      <div class="tool-selector-container">
        <select id="tool-select" onchange="switchMainTool()">
          <option value="base64">Base64 デコード</option>
          <option value="hex">16進数 (Hex) デコード</option>
          <option value="binary">2進数 (Binary) デコード</option>
          <option value="caesar">シーザー暗号 (Caesar)</option>
          <option value="atbash">アトバシュ暗号 (Atbash)</option>
          <option value="vigenere">ヴィジュネル暗号 (Vigenère)</option>
          <option value="url">URL デコード</option>
          <option value="html">HTMLエンティティ デコード</option>
          <option value="hash">ハッシュ値識別 (Hash)</option>
        </select>
      </div>

      <div id="tool-extra-caesar" style="display:none; margin-top: 10px;">
        <select id="tool-caesar-shift-select"></select>
      </div>

      <div id="tool-extra-vigenere" style="display:none; margin-top: 10px;">
        <input type="text" id="tool-vigenere-key" placeholder="鍵 (Key) を入力" />
      </div>

      <textarea id="tool-input" placeholder="変換・解析したいテキストを入力してください" style="margin-top: 15px;"></textarea>
      <button onclick="runSelectedMainTool()">実行</button>

      <div id="tool-main-result" class="tool-result"></div>
      <img id="tool-main-img" class="result-image" style="display:none;" />
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
